[workspace]
members = [
    "crates/iced-widget-patch",
    "crates/pdf-folio-core",
    "crates/pdf-folio-db",
    "crates/pdf-folio-style",
    "crates/pdf-folio-viewer",
    "crates/pdf-folio-ui-components",
    "crates/pdf-folio-ui",
    "crates/pdf-folio-main",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pdf-folio/pdf-folio"

[workspace.dependencies]
anyhow = "1.0.103"
blake3 = "1.8.5"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
iced = { version = "0.14.0", features = ["advanced", "canvas", "tokio", "image", "svg"] }
image = "0.25.10"
kdl = "6.7.1"
lru = "0.18.0"
notify = "9.0.0-rc.4"
pdf-writer = "0.15.0"
pdfium-render = { version = "0.9.2", features = ["thread_safe"] }
rayon = "1.12.0"
rfd = "0.17.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tantivy = "0.26.1"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
wasmtime = "46.0.1"

[patch.crates-io]
# The local `iced_widget` patch re-exports upstream iced_widget from this exact
# revision and overrides only `scrollable`. Keep the supporting iced crates on
# the same source so Rust sees one coherent set of iced core/renderer types.
iced_core = { git = "https://github.com/iced-rs/iced", rev = "54abf81d13fec06d4d9ac754b03ce2c3313e8a1f" }
iced_debug = { git = "https://github.com/iced-rs/iced", rev = "54abf81d13fec06d4d9ac754b03ce2c3313e8a1f" }
iced_futures = { git = "https://github.com/iced-rs/iced", rev = "54abf81d13fec06d4d9ac754b03ce2c3313e8a1f" }
iced_graphics = { git = "https://github.com/iced-rs/iced", rev = "54abf81d13fec06d4d9ac754b03ce2c3313e8a1f" }
iced_highlighter = { git = "https://github.com/iced-rs/iced", rev = "54abf81d13fec06d4d9ac754b03ce2c3313e8a1f" }
iced_renderer = { git = "https://github.com/iced-rs/iced", rev = "54abf81d13fec06d4d9ac754b03ce2c3313e8a1f" }
iced_runtime = { git = "https://github.com/iced-rs/iced", rev = "54abf81d13fec06d4d9ac754b03ce2c3313e8a1f" }
iced_tiny_skia = { git = "https://github.com/iced-rs/iced", rev = "54abf81d13fec06d4d9ac754b03ce2c3313e8a1f" }
iced_wgpu = { git = "https://github.com/iced-rs/iced", rev = "54abf81d13fec06d4d9ac754b03ce2c3313e8a1f" }
iced_winit = { git = "https://github.com/iced-rs/iced", rev = "54abf81d13fec06d4d9ac754b03ce2c3313e8a1f" }
iced_widget = { path = "crates/iced-widget-patch" }
